name: Dashboard checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check atlas.js && node --check dashboard-data.js && node --check sw.js
      - run: node --test tests/*.test.js
